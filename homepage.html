<!DOCTYPE html>
<html>
<head>
  <title>Dynamic Page</title>
</head>
<body>
  <h1>Dynamic GitHub Page</h1>
  <button onclick="loadData()">Load Data</button>
  <div id="result"></div>

  <script>
    function loadData() {
      fetch("https://api.github.com/users/babulnayek")
        .then(res => res.json())
        .then(data => {
          document.getElementById("result").innerHTML =
            `<p>Name: ${data.name}</p>
             <p>Public Repos: ${data.public_repos}</p>`;
        });
    }
  </script>
</body>
</html>
