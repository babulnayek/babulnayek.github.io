<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bharat's Data Engineering Hub</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;

      /* Light Mode Background – Corporate Library */
      background: url('https://images.unsplash.com/photo-1524995997946-a1c2e315a42f')
                  no-repeat center center fixed;
      background-size: cover;

      color: #fff;
      transition: background 0.4s, color 0.4s;
    }

    /* Dark Mode Background – Moonlight Scene */
    .dark {
      background: url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee')
                  no-repeat center center fixed !important;
      background-size: cover !important;
      color: #e0e6f0;
    }

    /* Dark Mode Button */
    #toggleDark {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #1f6feb;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      color: white;
      font-size: 14px;
    }

    #toggleDark:hover {
      background: #255fd1;
    }

    /* Heading */
    h1 {
      text-align: center;
      font-size: 42px;
      margin-top: 120px;
      margin-bottom: 20px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    }

    .dark h1 {
      color: #00ffcc;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
    }

    /* Search Area */
    .search-area {
      max-width: 700px;
      margin: 0 auto;
      text-align: center;
    }

    #searchBox {
      width: 100%;
      padding: 14px;
      font-size: 20px;
      border-radius: 10px;
      border: none;
      outline: none;
      background: rgba(255,255,255,0.85);
      color: #000;
    }

    .dark #searchBox {
      background: rgba(31,41,55,0.85);
      color: #fff;
      border: 1px solid #374151;
    }

    /* Search Results */
    #results {
      list-style: none;
      padding: 0;
      margin-top: 20px;
    }

    #results li {
      background: rgba(255,255,255,0.9);
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      text-align: center;
      font-size: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .dark #results li {
      background: rgba(31,41,55,0.9);
      color: #e0e6f0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    #results li a {
      color: #1f6feb;
      text-decoration: none;
      font-weight: 500;
    }

    .dark #results li a {
      color: #00e6b8;
    }
  </style>
</head>

<body>

  <button id="toggleDark">Dark Mode</button>

  <h1>Bharat's Data Engineering Hub</h1>

  <div class="search-area">
    <input id="searchBox" placeholder="Search topics (HDFS, Spark, Scala...)" />
    <ul id="results"></ul>
  </div>

  <script>
    // Dark Mode Toggle
    document.getElementById("toggleDark").onclick = () => {
      document.body.classList.toggle("dark");
    };

    // Searchable items
    const items = [
      { name: "HDFS", link: "hdfs-Questions.html" },
      { name: "MapReduce", link: "mapreduce-Questions.html" },
      { name: "Sqoop", link: "sqoop-Questions.html" },
      { name: "Hive / Beeline", link: "hive-Questions.html" },
      { name: "Pig", link: "pig-Questions.html" },
      { name: "Spark", link: "Spark-Questions.html" },
      { name: "Scala", link: "scala-Questions.html" },
      { name: "Unix", link: "unix-Questions.html" },
      { name: "Q&A Dashboard", link: "dashboard.html" },
      { name: "AWS S3", link: "aws-s3.html" }
    ];

    const searchBox = document.getElementById("searchBox");
    const results = document.getElementById("results");

    searchBox.addEventListener("input", () => {
      const text = searchBox.value.toLowerCase();
      results.innerHTML = "";

      if (text.trim() === "") return;

      items
        .filter(item => item.name.toLowerCase().includes(text))
        .forEach(item => {
          const li = document.createElement("li");
          li.innerHTML = `<a href="${item.link}">${item.name}</a>`;
          results.appendChild(li);
        });
    });
  </script>

</body>
</html>
