<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bharat's Data Engineering Hub</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: url('https://images.unsplash.com/photo-1524995997946-a1c2e315a42f')
                  no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      transition: background 0.4s, color 0.4s;
    }

    /* Dark Mode */
    .dark {
      background: url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee')
                  no-repeat center center fixed !important;
      background-size: cover !important;
      color: #e0e6f0;
    }

    /* Top-right buttons */
    .top-buttons {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 12px;
      z-index: 999;
    }

    /* Shared button style */
    .top-buttons button,
    .top-buttons a {
      background: #1f6feb;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      color: white;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      transition: background 0.2s ease;
    }

    .top-buttons button:hover,
    .top-buttons a:hover {
      background: #255fd1;
    }

    /* Heading */
    h1 {
      text-align: center;
      font-size: 42px;
      margin-top: 140px;
      margin-bottom: 20px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    }

    .dark h1 {
      color: #00ffcc;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
    }

    /* Search Area */
    .search-area {
      max-width: 700px;
      margin: 0 auto;
      text-align: center;
    }

    #searchBox {
      width: 100%;
      padding: 14px;
      font-size: 20px;
      border-radius: 10px;
      border: none;
      outline: none;
      background: rgba(255,255,255,0.85);
      color: #000;
    }

    .dark #searchBox {
      background: rgba(31,41,55,0.85);
      color: #fff;
      border: 1px solid #374151;
    }

    /* Search Results */
    #results {
      list-style: none;
      padding: 0;
      margin-top: 20px;
    }

    #results li {
      background: rgba(255,255,255,0.9);
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      text-align: center;
      font-size: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .dark #results li {
      background: rgba(31,41,55,0.9);
      color: #e0e6f0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    #results li a {
      color: #1f6feb;
      text-decoration: none;
      font-weight: 500;
    }

    .dark #results li a {
      color: #00e6b8;
    }
  </style>
</head>

<body>

  <!-- TOP RIGHT BUTTONS -->
  <div class="top-buttons">
    <a id="dashboardBtn" href="dashboard.html">Dashboard</a>
    <button id="toggleDark">Dark Mode</button>
  </div>

  <h1>Bharat's Data Engineering Commands Hub</h1>

  <!-- SEARCH -->
  <div class="search-area">
    <input id="searchBox" placeholder="Search topics (HDFS, Spark, Scala...)" />
    <ul id="results"></ul>
  </div>

  <script>
    // Dark Mode Toggle
    document.getElementById("toggleDark").onclick = () => {
      document.body.classList.toggle("dark");
    };

    // Searchable items
    const items = [
      { name: "HDFS", link: "hdfs-Questions.html" },
      { name: "MapReduce", link: "mapreduce-Questions.html" },
      { name: "Sqoop", link: "sqoop-Questions.html" },
      { name: "Hive / Beeline", link: "hive-Questions.html" },
      { name: "Pig", link: "pig-Questions.html" },
      { name: "Spark", link: "Spark-Questions.html" },
      { name: "Scala", link: "scala-Questions.html" },
      { name: "Unix", link: "unix-Questions.html" },

      /* Commands Pages */
      { name: "HDFS Commands", link: "hdfs-commands.html" },
      { name: "Hive Commands", link: "hive-commands.html" },
      { name: "Sqoop Commands", link: "sqoop-commands.html" },
      { name: "Scala Commands", link: "scala-commands.html" },
      { name: "Unix Commands", link: "unix-commands.html" },
      { name: "Kafka Commands", link: "kafka-commands.html" },
      { name: "Airflow Commands", link: "airflow-commands.html" },
      { name: "EMR Commands", link: "emr-commands.html" },
      { name: "Glue Commands", link: "glue-commands.html" },
      { name: "Databricks Commands", link: "databricks-commands.html" },
      { name: "AWS S3", link: "aws-s3.html" },

      /* Git Pages */
      { name: "Git Commands", link: "git-commands.html" },
      { name: "Git Interview Questions", link: "git-interview-questions.html" },
      { name: "GitHub Actions Commands", link: "git-actions-commands.html" },
      { name: "Git Branching Strategy", link: "git-branching-strategy.html" },
      { name: "Git Troubleshooting Guide", link: "git-troubleshooting.html" },
      { name: "Git Cheat Sheet", link: "git-cheat-sheet.html" },

      /* Python Pages */
      { name: "Python Cheat Sheet", link: "python-cheat-sheet.html" },
      { name: "Python Commands", link: "python-commands.html" },

      /* Dashboard */
      { name: "Q&A Dashboard", link: "dashboard.html" }
    ];

    const searchBox = document.getElementById("searchBox");
    const results = document.getElementById("results");

    searchBox.addEventListener("input", () => {
      const text = searchBox.value.toLowerCase();
      results.innerHTML = "";

      if (text.trim() === "") return;

      items
        .filter(item => item.name.toLowerCase().includes(text))
        .forEach(item => {
          const li = document.createElement("li");
          li.innerHTML = `<a href="${item.link}">${item.name}</a>`;
          results.appendChild(li);
        });
    });
  </script>

</body>
</html>
